<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIT ENERGY</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
}

header{
    height:100vh;
    background:url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=1600&auto=format&fit=crop') center/cover;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.overlay{
    background:rgba(0,0,0,0.7);
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding:20px;
}

header h1{
    font-size:70px;
    color:#ff2e63;
}

header p{
    font-size:22px;
    margin-top:10px;
}

.btn{
    margin-top:25px;
    padding:15px 35px;
    border:none;
    background:#ff2e63;
    color:white;
    font-size:18px;
    cursor:pointer;
    border-radius:10px;
    transition:0.3s;
}

.btn:hover{
    background:#ff004c;
    transform:scale(1.05);
}

nav{
    position:fixed;
    top:0;
    width:100%;
    background:#111;
    padding:15px;
    display:flex;
    justify-content:center;
    gap:20px;
    z-index:1000;
}

nav button{
    background:none;
    border:none;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

nav button:hover{
    color:#ff2e63;
}

section{
    padding:100px 20px;
    text-align:center;
}

.section-title{
    font-size:40px;
    margin-bottom:40px;
    color:#ff2e63;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    background:#1c1c1c;
    width:300px;
    padding:25px;
    border-radius:20px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card h3{
    margin-bottom:15px;
    color:#ff2e63;
}

.price{
    font-size:35px;
    margin:15px 0;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:15px;
}

.contact{
    display:flex;
    flex-direction:column;
    gap:20px;
    align-items:center;
}

footer{
    background:#111;
    padding:20px;
    text-align:center;
}

.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    display:none;
    align-items:center;
    justify-content:center;
}

.modal-content{
    background:#1c1c1c;
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:400px;
}

.modal-content input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
}

.close{
    float:right;
    cursor:pointer;
    font-size:25px;
    color:red;
}
</style>
</head>
<body>

<nav>
    <button onclick="scrollToSection('about')">О клубе</button>
    <button onclick="scrollToSection('prices')">Тарифы</button>
    <button onclick="scrollToSection('gallery')">Галерея</button>
    <button onclick="scrollToSection('contacts')">Контакты</button>
</nav>

<header>
    <div class="overlay">
        <h1>FIT ENERGY</h1>
        <p>Стань сильнее уже сегодня</p>
        <button class="btn" onclick="openModal()">Записаться</button>
    </div>
</header>

<section id="about">
    <h2 class="section-title">О нашем клубе</h2>
    <p>
        Современный фитнес-клуб с лучшими тренажёрами,
        профессиональными тренерами и мощной атмосферой.
    </p>
</section>

<section id="prices">
    <h2 class="section-title">Тарифы</h2>

    <div class="cards">

        <div class="card">
            <h3>START</h3>
            <div class="price">15 000 ₸</div>
            <p>1 месяц</p>
            <button class="btn" onclick="buyTariff('START')">
                Купить
            </button>
        </div>

        <div class="card">
            <h3>PRO</h3>
            <div class="price">39 000 ₸</div>
            <p>3 месяца</p>
            <button class="btn" onclick="buyTariff('PRO')">
                Купить
            </button>
        </div>

        <div class="card">
            <h3>VIP</h3>
            <div class="price">80 000 ₸</div>
            <p>12 месяцев</p>
            <button class="btn" onclick="buyTariff('VIP')">
                Купить
            </button>
        </div>

    </div>
</section>

<section id="gallery">
    <h2 class="section-title">Наш зал</h2>

    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1200&auto=format&fit=crop">
        <img src="https://images.unsplash.com/photo-1571902943202-507ec2618e8f?q=80&w=1200&auto=format&fit=crop">
        <img src="https://images.unsplash.com/photo-1518611012118-696072aa579a?q=80&w=1200&auto=format&fit=crop">
        <img src="https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=1200&auto=format&fit=crop">
    </div>
</section>

<section id="contacts">
    <h2 class="section-title">Контакты</h2>

    <div class="contact">
        <p>📍 Астана</p>

        <button class="btn" onclick="openWhatsApp()">
            WhatsApp
        </button>

        <button class="btn" onclick="openInstagram()">
            Instagram
        </button>

        <button class="btn" onclick="showMap()">
            Открыть карту
        </button>
    </div>
</section>

<footer>
    © 2026 FIT ENERGY
</footer>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>

        <h2>Запись</h2>

        <input type="text" placeholder="Ваше имя">
        <input type="tel" placeholder="Телефон">

        <button class="btn" onclick="sendForm()">
            Отправить
        </button>
    </div>
</div>

<script>
function scrollToSection(id){
    document.getElementById(id).scrollIntoView({
        behavior:'smooth'
    });
}

function openModal(){
    document.getElementById('modal').style.display='flex';
}

function closeModal(){
    document.getElementById('modal').style.display='none';
}

function sendForm(){
    alert('Заявка отправлена!');
    closeModal();
}

function buyTariff(tariff){
    alert('Вы выбрали тариф: ' + tariff);
}

function openWhatsApp(){
    window.open('https://wa.me/77000000000');
}

function openInstagram(){
    window.open('https://instagram.com');
}

function showMap(){
    window.open('https://maps.google.com');
}
</script>

</body>
</html>
